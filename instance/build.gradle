plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArgument "--username"
            programArgument "Dev"
        }

        client2 {
            client()
            gameDirectory = rootProject.file('run2')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArgument "--username"
            programArgument "QiHuang02"
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                    file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

dependencies {
    implementation project(':core')
    jarJar project(':core')
    additionalRuntimeClasspath project(':core')

    compileOnly("dev.architectury:architectury-neoforge:${architectury_version}")
    compileOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}")
    compileOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}")
    compileOnly("dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}")

    runtimeOnly("dev.architectury:architectury-neoforge:${architectury_version}")
    runtimeOnly("dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}")
    runtimeOnly("dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}")
    runtimeOnly("dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}")

    compileOnly("org.appliedenergistics.yoga:yoga:1.0.0")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description,
                             ftb_teams_version      : ftb_teams_version,
                             ftb_chunks_version     : ftb_chunks_version]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${rootProject.projectDir}/repo"
        }
    }
}
